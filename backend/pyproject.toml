[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "subscribe-manager-api"
version = "0.1.0"
description = "FastAPI backend for subscribe-manager"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.162.0,<1.0.0",
  "httpx>=0.28.0,<1.0.0",
  "pydantic-settings>=2.16.0,<3.0.0",
  "PyJWT[crypto]>=2.15.0,<3.0.0",
  "tzdata>=2026.1",
  "uvicorn>=0.41.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0,<10.0.0",
  "ruff>=0.15.0,<1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
